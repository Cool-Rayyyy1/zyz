- title: Research Experience
  type: time_table
  contents:
    - title: ADSS – Boosting Text-to-Image Diffusion Models via Attention-Driven Seed Selection
      institution: Brandeis University, Waltham, MA, USA
      year: Feb. 2025 – Aug. 2025
      description:
        - First-author project (in progress), targeting ICLR 2026 submission.
        - Proposed Attention-Driven Seed Selection, a training-free plug-and-play scheme that ranks seeds via early cross-attention concentration.
        - Improved image relevance and quality across multiple Stable Diffusion backbones and public benchmarks, with lightweight per-seed screening.
    - title: Cross-Modality Controlled Molecule Generation with Diffusion Language Model
      institution: Brandeis University, Waltham, MA, USA
      year: Feb. 2024 – Jan. 2025
      description:
        - First-author project (in progress), targeting AAAI 2026 submission.
        - Proposed controllable SMILES generation under joint property and structure objectives using a diffusion-based paradigm.
        - Achieved significant gains in target-property satisfaction and scaffold similarity via classifier-guided and classifier-free conditioning.
        - Paper preprint available at <a href="https://arxiv.org/pdf/2508.14748">arXiv 2508.14748</a>.

